[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dealchecker"
version = "0.1.0"
description = "Local, transparent price monitoring and discovery"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "aiohttp>=3.11,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]

[project.scripts]
dealchecker = "dealchecker.__main__:main"

[tool.setuptools.packages.find]
include = ["dealchecker*"]

[tool.setuptools.package-data]
dealchecker = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
